name: Scientific checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONOPTIMIZE: ''
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Replay owned finite evidence from the flat artifact root
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/twosum-scientific-checks"
          mkdir -p "$out"
          export TWOSUM_OUTPUT="$out/replay"
          ulimit -v 2300000
          ulimit -t 2600
          timeout --signal=TERM --kill-after=10s 110s bash -euo pipefail -c '
            ulimit -t 105
            python -B tests/regression_search_accounting.py
          ' > "$out/search-accounting.log" 2>&1
          timeout --signal=TERM --kill-after=10s 2700s \
            python -B reproduce.py --mode full --output "$TWOSUM_OUTPUT" \
            > "$out/whole-run.log" 2>&1
      - name: Retain raw stage results, diagnostics and partial progress
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: twosum-scientific-checks
          path: ${{ runner.temp }}/twosum-scientific-checks/
          if-no-files-found: warn
          include-hidden-files: true
